<div id="app">
  <header class="top">
    <div class="brand"><svg class="ic f lg"><use href="#i-cross"/></svg><span>Gospel For All</span></div>
    <button class="ib" id="btnTheme" aria-label="Toggle dark mode"><svg class="ic"><use id="themeIcon" href="#i-moon"/></svg></button>
  </header>
  <div class="ticker" aria-live="off"><div class="tk" id="tk"></div></div>

  <main class="main">
    <select id="lang" aria-label="Language"></select>
    <div class="mn">
      <div class="mt" data-i="ministryTitle"></div>
      <p class="ms" data-i="tag"></p>
      <div class="stats">
        <div class="st"><b data-count="6000000">0</b><span data-i="statSouls"></span></div>
        <div class="st"><b data-count="6">0</b><span data-i="statContinents"></span></div>
        <div class="st"><b data-count="9">0</b><span data-i="statLanguages"></span></div>
      </div>
      <div class="chips"><span>Africa</span><span>Asia</span><span>Europe</span><span>North America</span><span>South America</span><span>Oceania</span></div>
    </div>
    <div class="card">
      <div class="lbl" data-i="verseLbl"></div>
      <p class="vt" id="vtext"></p>
      <p class="vr" id="vref"></p>
      <button class="btn tn" id="btnNext"><svg class="ic"><use href="#i-next"/></svg><span data-i="next"></span></button>
    </div>
    <button class="btn" id="btnInstall"><svg class="ic"><use href="#i-dl"/></svg><span data-i="install"></span></button>
    <button class="btn tn" id="btnShare"><svg class="ic"><use href="#i-share"/></svg><span data-i="shareApp"></span></button>
    <button class="btn alt" id="btnTeam"><svg class="ic f"><use href="#i-team"/></svg><span data-i="btnTeam"></span></button>
    <button class="btn alt" id="btnWhy"><svg class="ic f"><use href="#i-heart"/></svg><span data-i="btnWhy"></span></button>
    <button class="btn alt" id="btnContact"><svg class="ic"><use href="#i-chat"/></svg><span data-i="contact"></span></button>
    <button class="btn alt" id="btnDev"><svg class="ic"><use href="#i-code"/></svg><span data-i="about"></span></button>
  </main>
</div>

<section class="modal" id="mShare">
  <div class="mh"><h2 data-i="shareTitle"></h2><button class="x" data-close aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button></div>
  <p class="sub" data-i="shareSub"></p>
  <div class="stack">
    <button class="btn bt" id="shBt"><svg class="ic"><use href="#i-bt"/></svg><span data-i="bt"></span></button>
    <button class="btn wa" id="shWa"><svg class="ic f"><use href="#i-wa"/></svg><span data-i="wa"></span></button>
    <button class="btn fb" id="shFb"><svg class="ic f"><use href="#i-fb"/></svg><span data-i="fb"></span></button>
  </div>
</section>

<section class="modal" id="mContact">
  <div class="mh"><h2 data-i="contactTitle"></h2><button class="x" data-close aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button></div>
  <p class="sub" data-i="contactSub"></p>
  <div class="crow">
    <button class="cb em" id="cEmail" aria-label="Email"><svg class="ic xl"><use href="#i-mail"/></svg></button>
    <button class="cb fb" id="cFb" aria-label="Facebook"><svg class="ic xl f"><use href="#i-fb"/></svg></button>
    <button class="cb ph" id="cPhone" aria-label="Phone"><svg class="ic xl"><use href="#i-phone"/></svg></button>
    <button class="cb wa" id="cWa" aria-label="WhatsApp"><svg class="ic xl f"><use href="#i-wa"/></svg></button>
  </div>
</section>

<section class="modal" id="mDev">
  <div class="mh"><h2 data-i="devTitle"></h2><button class="x" data-close aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button></div>
  <div class="pw">
    <div class="ring"><span class="orb"><svg class="ic"><use href="#i-code"/></svg></span></div>
    <div class="photo"><img id="devPhoto" width="160" height="160" alt="Developer photo" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 160'%3E%3Crect width='160' height='160' fill='%231d2029'/%3E%3Ccircle cx='80' cy='62' r='28' fill='%239aa0ad'/%3E%3Cpath d='M22 160c4-38 30-56 58-56s54 18 58 56z' fill='%239aa0ad'/%3E%3C/svg%3E"></div>
  </div>
  <h3 class="dn" id="devName"></h3>
  <p class="dr" data-i="devRole"></p>
  <p class="db clamp" id="devBio"></p>
  <button class="tg" id="devMore" hidden></button>
</section>
